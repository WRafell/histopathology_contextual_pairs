random_seed: 2024
dataset: camelyon16
patch_size: 256
patch_resize: 128
batch_size: 256
num_workers: 16
num_batches: 1000
num_slides_per_batch: 16
positive_pair_sampling: baseline
backbone:
  _target_: torchvision.models.resnet18
  weights: ResNet18_Weights.DEFAULT
optimizer:
  _target_: torch.optim.Adam
  lr: 0.0003
  weight_decay: 0.01
scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
ssl_method: barlow_twins
learning_rate: 0.0003
max_epochs: 100
barlow_twins:
  projector: 1028-1028-1028
  lambd: 0.0051
