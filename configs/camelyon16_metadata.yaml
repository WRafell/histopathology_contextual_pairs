# Camelyon16 20x 224 px patches on soda (/nas2). Splits and slide labels come from an earlier
# ABMIL run manifest (train 243, val 27, official test 129); magnifications from TopoSlide inputs.
patch_manifest_glob: /nas2/lait/1000_Members/wrafell/CAMELYON16/patches_20x_224_png/patch_manifest_shard*.csv
split_manifest: /nas2/lait/1000_Members/wrafell/CAMELYON16/derived/patch_grid_inputs/runs/abmil_hibou_224_43c8/manifest.csv
slide_dimensions: /nas2/lait/1000_Members/wrafell/CAMELYON16/toposlide/inputs/wsi_dim.csv
mask_dir: /nas2/lait/1000_Members/wrafell/CAMELYON16/masks
mask_suffix: _mask.tif
