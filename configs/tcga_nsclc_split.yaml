# TCGA-NSCLC (LUAD = 0 vs. LUSC = 1): primary-tumor diagnostic (FFPE, DX) slides from the GDC download
# manifests on soda, split at patient level, stratified by class. The committed result is
# configs/splits/tcga_nsclc_split.csv.
luad_manifest: /nas2/lait/1000_Members/wrafell/TCGA/LUAD/gdc_manifest.tsv
lusc_manifest: /nas2/lait/1000_Members/wrafell/TCGA/LUSC/gdc_manifest.tsv
