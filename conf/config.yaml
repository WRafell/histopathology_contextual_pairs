random_seed: 0
device: cuda:0


# Data related
dataset: seedp-stomach
shuffle_train: True
patch_resize: 64
batch_size: 2048
num_workers: 16
num_batches: 1000
num_slides_per_batch: 16


# Pair sampling
positive_pair_sampling: baseline
proximity_level: 7


# Preselected Pairs
num_preselected_patches: 256000


# Model related
backbone_name: resnet18
optimizer: 
  _target_: torch.optim.Adam
  lr: 0.0003
  weight_decay: 0.01
scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
ssl_method: barlow_twins
accelerator: gpu
devices: [0,1]
max_epochs: 100

# LARS Optimizer
use_lars_optimizer: True
lars:
    lr: 0
    base_lr: 0.2
    weight_decay: 0.000001
    weight_decay_filter: 1
    lars_adaptation_filter: 2


# SSL related
barlow_twins:
  projector: 1028-1028-1028
  lambd: 0.0051

byol:
  mlp_hidden_size: 512
  projector_dim: 128
  momentum: 0.996

simsiam:
  encoder_dim: 1028
  pred_dim: 512

vicreg:
    projector_arch: 1028-1028-1028
    sim_coeff: 25.0
    std_coeff: 25.0
    cov_coeff: 1.0

# MIL related
mil:
  mil_method: abmil
  learning_rate: 0.001
  weight_decay: 1e-6
  max_epochs: 100



