random_seed: 0
device: cuda:0


# Data related
dataset: camelyon16
shuffle_train: True
patch_resize: 64
batch_size: 2048
num_workers: 16
num_batches: 1000
num_slides_per_batch: 16


# Pair sampling
positive_pair_sampling: preselected_positive_pairs
proximity_level: 7


# Preselected Pairs
num_preselected_patches: 256000


# Model related
backbone_name: resnet18
optimizer:
  _target_: torch.optim.Adam
  lr: 0.0003
  weight_decay: 0.01
scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
ssl_method: barlow_twins
accelerator: gpu
devices: [0,1]
max_epochs: 100


# SSL related
barlow_twins:
  projector: 1028-1028-1028
  lambd: 0.0051

byol:
  mlp_hidden_size: 512
  projector_dim: 128
  momentum: 0.996

simsiam:
  encoder_dim: 1024
  pred_dim: 512



# MIL related
mil:
  mil_method: abmil
  learning_rate: 0.001
  weight_decay: 1e-6
  max_epochs: 100



